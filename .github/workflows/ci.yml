name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Frontmatter strict-6 lint
        run: node scripts/ci/lint-frontmatter.mjs

      - name: Plugin agents lint
        run: node scripts/ci/lint-agents.mjs

      - name: Version drift check
        run: node scripts/ci/check-drift.mjs

      - name: Link + heading lint
        run: node scripts/ci/check-links.mjs

      - name: Bundle caps
        run: bash scripts/ci/check-bundle.sh

      - name: Legacy tool-name gate
        run: bash scripts/ci/check-legacy-names.sh

      - name: biomcp-ts tool-name drift gate
        run: node scripts/ci/check-tool-names.mjs

      - name: Marketplace validation
        run: node scripts/ci/check-marketplace.mjs

      - name: WorkBuddy connector build smoke
        run: |
          OUT="$(mktemp -d)"
          node scripts/ci/build-connector-workbuddy.mjs --out "$OUT"
          TARBALL="$OUT/bioresearcher-connector_workbuddy-v$(tr -d '[:space:]' < VERSION).tar.gz"
          test -s "$TARBALL"
          tar -tzf "$TARBALL" | grep -qx 'bioresearcher/connector-meta.json'
          tar -tzf "$TARBALL" | grep -qx 'bioresearcher/mcp.json'
          tar -tzf "$TARBALL" | grep -qx "bioresearcher/$(cd connector/workbuddy && ls icon.* | head -1)"
          N="$(node -p 'Object.keys(require("./connector/workbuddy/skill-locales.json").skills).length')"
          M="$(tar -tzf "$TARBALL" | grep -c '^bioresearcher/skills/[^/]*/SKILL.md$')"
          test "$N" -eq "$M"

      - name: OpenCode connector build smoke
        run: |
          OUT="$(mktemp -d)"
          node scripts/ci/build-connector-opencode.mjs --out "$OUT"
          TARBALL="$OUT/bioresearcher-connector_opencode-v$(tr -d '[:space:]' < VERSION).tar.gz"
          test -s "$TARBALL"
          tar -tzf "$TARBALL" | grep -qx 'bioresearcher/connector-meta.json'
          tar -tzf "$TARBALL" | grep -qx 'bioresearcher/package.json'
          tar -tzf "$TARBALL" | grep -qx 'bioresearcher/index.js'
          tar -tzf "$TARBALL" | grep -qx 'bioresearcher/loader.js'
          tar -tzf "$TARBALL" | grep -qx 'bioresearcher/skill-bundle.json'
          tar -tzf "$TARBALL" | grep -qx 'bioresearcher/README.md'
          tar -tzf "$TARBALL" | grep -qx 'bioresearcher/LICENSE'
          tar -tzf "$TARBALL" | grep -qx 'bioresearcher/agents/bioresearcher-dr-worker.md'
          N="$(node -p 'require("./connector/opencode/skill-bundle.json").skills.length')"
          M="$(tar -tzf "$TARBALL" | grep -c '^bioresearcher/skills/[^/]*/SKILL.md$')"
          test "$N" -eq "$M"
          (cd "$OUT/bioresearcher" && npm pack --dry-run)

      - name: DeepSeek Harness connector build smoke
        run: |
          OUT="$(mktemp -d)"
          node scripts/ci/build-connector-dsh.mjs --out "$OUT"
          TARBALL="$OUT/bioresearcher-connector_dsh-v$(tr -d '[:space:]' < VERSION).tar.gz"
          test -s "$TARBALL"
          tar -tzf "$TARBALL" | grep -qx 'bioresearcher/connector-meta.json'
          tar -tzf "$TARBALL" | grep -qx 'bioresearcher/package.json'
          tar -tzf "$TARBALL" | grep -qx 'bioresearcher/index.js'
          tar -tzf "$TARBALL" | grep -qx 'bioresearcher/cordis.patch.yml'
          tar -tzf "$TARBALL" | grep -qx 'bioresearcher/skill-bundle.json'
          tar -tzf "$TARBALL" | grep -qx 'bioresearcher/agents/bioresearcher-dr-worker.md'
          N="$(node -p 'require("./connector/dsh/skill-bundle.json").skills.length')"
          M="$(tar -tzf "$TARBALL" | grep -c '^bioresearcher/skills/[^/]*/SKILL.md$')"
          test "$N" -eq "$M"

      # Supplementary: official spec reference validator, pinned by commit.
      # Non-blocking (upstream marks it "not for production").
      - name: skills-ref validate (supplementary)
        continue-on-error: true
        run: |
          for d in skills/*/; do
            uvx --from git+https://github.com/agentskills/agentskills@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref \
              skills-ref validate "$d"
          done

      # End-to-end discovery smoke via the skills CLI, against the LOCAL tree.
      # DISABLE_TELEMETRY keeps CI runs out of skills.sh rankings.
      - name: skills CLI discovery smoke
        env:
          DISABLE_TELEMETRY: "1"
        run: npx -y skills@1.5.23 add ./ --list

      - name: Python script checks
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -m py_compile skills/bioresearcher-deep-research/scripts/markdown-to-html.py \
            skills/bioresearcher-pubmed-weekly/scripts/parse_updatefiles.py \
            skills/bioresearcher-pubmed-weekly/scripts/pubmed_weekly.py \
            skills/bioresearcher-plot-making/scripts/plot_helpers.py \
            skills/bioresearcher-plot-making/scripts/audit_panel_alignment.py \
            skills/bioresearcher-plot-making/scripts/audit_figure_collisions.py \
            skills/bioresearcher-plot-making/scripts/audit_pdf_text.py
          uv run --with openpyxl python -c "import openpyxl; print('openpyxl', openpyxl.__version__)"

      - name: agent-test suite validation (no LLM spawn)
        run: |
          node --check agent-test/run.mjs
          node agent-test/run.mjs --list
          node agent-test/run.mjs --dry-run
          # --dry-run parses test.json only; validate every case opencode.json too
          for f in agent-test/*/opencode.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8')); console.log('json ok $f')"
          done

      - name: claude plugin suite validation (hermetic, no LLM spawn)
        run: |
          node --check agent-test/claude-plugin-specific/run.mjs
          node agent-test/claude-plugin-specific/run.mjs --list
          node agent-test/claude-plugin-specific/run.mjs --dry-run

      - name: opencode plugin suite validation (hermetic, no LLM spawn)
        run: |
          node --check agent-test/opencode-plugin-specific/run.mjs
          node agent-test/opencode-plugin-specific/run.mjs --list
          node agent-test/opencode-plugin-specific/run.mjs --dry-run

      - name: dsh plugin suite validation (hermetic, no LLM spawn)
        run: |
          node --check agent-test/dsh-plugin-specific/run.mjs
          node agent-test/dsh-plugin-specific/run.mjs --list
          node agent-test/dsh-plugin-specific/run.mjs --dry-run

      - name: demos pack validation (hermetic, no LLM spawn, no network)
        run: |
          node --check demos/run-demo.mjs
          node --check demos/lib/mcp-probe.mjs
          node --check demos/lib/publish.mjs
          node --check demos/check-demos.mjs
          node --check demos/website/build.mjs
          node demos/run-demo.mjs --list
          node demos/run-demo.mjs --dry-run
          node demos/check-demos.mjs
          node demos/website/build.mjs --out "$(mktemp -d)"
