name: release

# biomcp-ts release pattern: version bumped in a human-merged PR
# (chore(release): vX.Y.Z); on push to main, cut the tag/release if missing.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_notes:
        description: "Re-create release notes even if tag exists"
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Compute version + tag
        id: ver
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract release notes from CHANGELOG
        if: steps.ver.outputs.exists == 'false' || inputs.force_notes
        run: |
          awk -v ver="${{ steps.ver.outputs.version }}" '
            $0 ~ "^## \\[" ver "\\]" {grab=1; next}
            grab && /^## \[/ {exit}
            grab {print}
          ' CHANGELOG.md > /tmp/opencode-release-notes.md
          test -s /tmp/opencode-release-notes.md || { echo "no CHANGELOG section for ${{ steps.ver.outputs.version }}" >&2; exit 1; }

      - name: Create release
        if: steps.ver.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" \
            --latest \
            --target "$GITHUB_SHA" \
            --title "${{ steps.ver.outputs.tag }}" \
            --notes-file /tmp/opencode-release-notes.md

      - name: Update release notes (force)
        if: steps.ver.outputs.exists == 'true' && inputs.force_notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "${{ steps.ver.outputs.tag }}" --notes-file /tmp/opencode-release-notes.md

      # WorkBuddy connector asset. Idempotent: builds from the tag target when
      # the release is new, from an isolated tag worktree when forcing or when an
      # earlier run was interrupted before uploading; skips old tags that
      # predate connector/workbuddy/.
      - name: Bundle + attach WorkBuddy connector tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          VERSION="${{ steps.ver.outputs.version }}"
          TAG="${{ steps.ver.outputs.tag }}"
          ASSET="bioresearcher-connector_workbuddy-v${VERSION}.tar.gz"
          CLOBBER=""
          if [ "${{ steps.ver.outputs.exists }}" = "false" ]; then
            test -f connector/workbuddy/connector-meta.json || { echo "skip: no connector at HEAD"; exit 0; }
            node scripts/ci/build-connector-workbuddy.mjs --out dist
          else
            git cat-file -e "refs/tags/${TAG}:connector/workbuddy/connector-meta.json" || { echo "skip: no connector at ${TAG}"; exit 0; }
            if [ "${{ inputs.force_notes }}" = "true" ]; then
              CLOBBER="--clobber"
            elif gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx "$ASSET"; then
              echo "skip: $ASSET already attached to ${TAG}"
              exit 0
            fi
            WORK_DIR="$(mktemp -d)"
            git worktree add --detach "$WORK_DIR" "refs/tags/${TAG}"
            (cd "$WORK_DIR" && node scripts/ci/build-connector-workbuddy.mjs --out "$GITHUB_WORKSPACE/dist")
            git worktree remove --force "$WORK_DIR"
          fi
          gh release upload "$TAG" "dist/${ASSET}" $CLOBBER

      # OpenCode connector asset. Idempotent: builds from the tag target when
      # the release is new, from an isolated tag worktree when forcing or when an
      # earlier run was interrupted before uploading; skips old tags that
      # predate connector/opencode/.
      - name: Bundle + attach OpenCode connector tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          VERSION="${{ steps.ver.outputs.version }}"
          TAG="${{ steps.ver.outputs.tag }}"
          ASSET="bioresearcher-connector_opencode-v${VERSION}.tar.gz"
          CLOBBER=""
          if [ "${{ steps.ver.outputs.exists }}" = "false" ]; then
            test -f connector/opencode/connector-meta.json || { echo "skip: no opencode connector at HEAD"; exit 0; }
            node scripts/ci/build-connector-opencode.mjs --out dist/opencode
          else
            git cat-file -e "refs/tags/${TAG}:connector/opencode/connector-meta.json" || { echo "skip: no opencode connector at ${TAG}"; exit 0; }
            if [ "${{ inputs.force_notes }}" = "true" ]; then
              CLOBBER="--clobber"
            elif gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx "$ASSET"; then
              echo "skip: $ASSET already attached to ${TAG}"
              exit 0
            fi
            WORK_DIR="$(mktemp -d)"
            git worktree add --detach "$WORK_DIR" "refs/tags/${TAG}"
            (cd "$WORK_DIR" && node scripts/ci/build-connector-opencode.mjs --out "$GITHUB_WORKSPACE/dist/opencode")
            git worktree remove --force "$WORK_DIR"
          fi
          gh release upload "$TAG" "dist/opencode/${ASSET}" $CLOBBER

      # DeepSeek Harness (dsh) connector asset. Idempotent: builds from the tag target when
      # the release is new, from an isolated tag worktree when forcing or when an
      # earlier run was interrupted before uploading; skips old tags that
      # predate connector/dsh/.
      - name: Bundle + attach DeepSeek Harness connector tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          VERSION="${{ steps.ver.outputs.version }}"
          TAG="${{ steps.ver.outputs.tag }}"
          ASSET="bioresearcher-connector_dsh-v${VERSION}.tar.gz"
          CLOBBER=""
          if [ "${{ steps.ver.outputs.exists }}" = "false" ]; then
            test -f connector/dsh/connector-meta.json || { echo "skip: no dsh connector at HEAD"; exit 0; }
            node scripts/ci/build-connector-dsh.mjs --out dist/dsh
          else
            git cat-file -e "refs/tags/${TAG}:connector/dsh/connector-meta.json" || { echo "skip: no dsh connector at ${TAG}"; exit 0; }
            if [ "${{ inputs.force_notes }}" = "true" ]; then
              CLOBBER="--clobber"
            elif gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx "$ASSET"; then
              echo "skip: $ASSET already attached to ${TAG}"
              exit 0
            fi
            WORK_DIR="$(mktemp -d)"
            git worktree add --detach "$WORK_DIR" "refs/tags/${TAG}"
            (cd "$WORK_DIR" && node scripts/ci/build-connector-dsh.mjs --out "$GITHUB_WORKSPACE/dist/dsh")
            git worktree remove --force "$WORK_DIR"
          fi
          gh release upload "$TAG" "dist/dsh/${ASSET}" $CLOBBER

      # Publish opencode-bioresearcher to npm via OIDC Trusted Publishing (or ambient token).
      # Reusable script handles idempotency and skips already-published versions.
      - name: Publish OpenCode connector to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -eu
          TAG="${{ steps.ver.outputs.tag }}"
          if [ "${{ steps.ver.outputs.exists }}" = "true" ] && ! git cat-file -e "refs/tags/${TAG}:connector/opencode/connector-meta.json" 2>/dev/null; then
            echo "skip: opencode connector not present in ${TAG}"
            exit 0
          fi
          test -f connector/opencode/connector-meta.json || { echo "skip: no opencode connector in working tree"; exit 0; }
          test -f scripts/ci/build-connector-opencode.mjs || { echo "skip: no opencode build script in working tree"; exit 0; }
          test -f scripts/ci/publish-npm.mjs || { echo "skip: no npm publisher in working tree"; exit 0; }

          npm install -g npm@latest
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            npm config set //registry.npmjs.org/:_authToken "${NODE_AUTH_TOKEN}"
          fi
          # Ensure staged bundle exists even if previous step skipped tarball rebuild
          if [ ! -d "dist/opencode/bioresearcher" ]; then
            node scripts/ci/build-connector-opencode.mjs --out dist/opencode
          fi
          node scripts/ci/publish-npm.mjs dist/opencode/bioresearcher

      # Publish dsh-bioresearcher to npm via OIDC Trusted Publishing (or ambient token).
      # Reusable script handles idempotency and skips already-published versions.
      - name: Publish dsh connector to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -eu
          TAG="${{ steps.ver.outputs.tag }}"
          if [ "${{ steps.ver.outputs.exists }}" = "true" ] && ! git cat-file -e "refs/tags/${TAG}:connector/dsh/connector-meta.json" 2>/dev/null; then
            echo "skip: dsh connector not present in ${TAG}"
            exit 0
          fi
          test -f connector/dsh/connector-meta.json || { echo "skip: no dsh connector in working tree"; exit 0; }
          test -f scripts/ci/build-connector-dsh.mjs || { echo "skip: no dsh build script in working tree"; exit 0; }
          test -f scripts/ci/publish-npm.mjs || { echo "skip: no npm publisher in working tree"; exit 0; }

          npm install -g npm@latest
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            npm config set //registry.npmjs.org/:_authToken "${NODE_AUTH_TOKEN}"
          fi
          # Ensure staged bundle exists even if previous step skipped tarball rebuild
          if [ ! -d "dist/dsh/bioresearcher" ]; then
            node scripts/ci/build-connector-dsh.mjs --out dist/dsh
          fi
          node scripts/ci/publish-npm.mjs dist/dsh/bioresearcher
